<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">The Initloop repair loop</title>
  <desc id="desc">Read the app’s contracts, build local dependencies, and test real workflows. Failed checks feed the next repair until the app runs locally with a verified runbook.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2d"/><stop offset="1" stop-color="#0b111c"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="78" y1="178" x2="854" y2="178"><stop stop-color="#69e3c2"/><stop offset="1" stop-color="#8ba9ff"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5" fill="none" stroke="#8ba9ff" stroke-width="1.4"/></marker>
  </defs>
  <rect width="960" height="410" rx="20" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="40" y="43" fill="#69e3c2" font-size="12" font-weight="700" letter-spacing="2">INITLOOP / LOCAL DEVELOPMENT</text>
    <text x="40" y="90" fill="#f4f7fc" font-size="34" font-weight="700" letter-spacing="-1">From cloned to running.</text>
    <text x="40" y="119" fill="#a4b2c8" font-size="16">Turn the contracts in your code into a working local environment.</text>
    <path d="M112 178H354 M432 178H674 M752 178H854" stroke="url(#line)" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <g fill="#101c2d" stroke="#69e3c2" stroke-width="2"><circle cx="78" cy="178" r="19"/><circle cx="398" cy="178" r="19"/><circle cx="718" cy="178" r="19"/></g>
    <g fill="#69e3c2" font-size="14" font-weight="700" text-anchor="middle"><text x="78" y="183">1</text><text x="398" y="183">2</text><text x="718" y="183">3</text></g>
    <g fill="#f4f7fc" font-size="23" font-weight="650"><text x="58" y="231">Read the contracts</text><text x="378" y="231">Build locally</text><text x="698" y="231">Run real workflows</text></g>
    <g fill="#a4b2c8" font-size="15"><text x="58" y="258">Schemas. Migrations. API clients.</text><text x="378" y="258">Databases. Seed data. Local APIs.</text><text x="698" y="258">Verify requests and persistence.</text></g>
    <path d="M855 178H882Q904 178 904 200V282Q904 303 882 303H422Q398 303 398 279" fill="none" stroke="#8ba9ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="510" y="289" width="285" height="26" rx="13" fill="#18243b"/>
    <text x="652" y="307" fill="#bdcbff" font-size="13" font-weight="600" text-anchor="middle">Failed check? Feed it into the next repair.</text>
    <path d="M40 339H920" stroke="#263348"/>
    <circle cx="58" cy="373" r="10" fill="#69e3c2"/><path d="m53 373 3 3 6-7" stroke="#0b111c" stroke-width="2" fill="none"/>
    <text x="80" y="379" fill="#f4f7fc" font-size="17" font-weight="600">A working local app.</text>
    <text x="286" y="379" fill="#a4b2c8" font-size="15">Repeatable commands. A verified runbook. Ready for the next developer.</text>
  </g>
</svg>
